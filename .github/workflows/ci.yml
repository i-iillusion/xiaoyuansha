name: Godot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core rules (Godot 4.7.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare log directory
        run: |
          mkdir -p "$RUNNER_TEMP/godot-ci-logs"
          echo "CI_LOG_DIR=$RUNNER_TEMP/godot-ci-logs" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: false
          path: ${{ runner.temp }}/godot
          downloads-path: ${{ runner.temp }}/godot-downloads
          bin-path: ${{ runner.temp }}/godot-bin

      - name: Import project
        run: |
          set -euo pipefail
          mkdir -p "$CI_LOG_DIR"
          godot --version
          timeout --kill-after=10s 120s godot --headless --path . --editor --import --quit 2>&1 | tee "$CI_LOG_DIR/import.log"
          if grep -Eq '(^|[[:space:]])(SCRIPT ERROR:|ERROR:|Parse Error:)' "$CI_LOG_DIR/import.log"; then
            echo '::error::Godot reported errors during project import.'
            exit 1
          fi

      - name: Run rule test suite
        run: |
          set -euo pipefail
          failed=0
          tests=(
            test_rule_settlement
            test_confirmed_rules
            test_bill
            test_hand_payment
            test_card_transfer
            test_identity_victory
            test_free_for_all_victory
          )
          for test in "${tests[@]}"; do
            echo "::group::$test"
            log="$CI_LOG_DIR/$test.log"
            status=0
            timeout --kill-after=10s 60s godot --headless --path . --script "Test/$test.gd" 2>&1 | tee "$log" || status=$?
            if (( status != 0 )) \
              || ! grep -Eq '^RESULT: [1-9][0-9]* asserts, 0 failures[[:space:]]*$' "$log" \
              || grep -Eq '(^|[[:space:]])(SCRIPT ERROR:|ERROR:|Parse Error:|FAIL:)|^RESULT: .* [1-9][0-9]* failures' "$log"; then
              echo "::error::$test failed, timed out, or did not produce a successful RESULT (exit $status)."
              # 将失败前的进度和运行时错误暴露到公开注释，便于无日志下载权限时定位。
              # 日志来自仓库的合成测试；不改变超时、退出码或零失败门槛。
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                echo "::error title=$test diagnostic::$line"
              done < <(tail -n 16 "$log")
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"

      - name: Run LAN ownership and actual ENet process tests
        run: |
          set -euo pipefail
          for spec in 'test_i01 2' 'test_h03 2' 'test_h02 2' 'test_h01_layout 2' 'test_ai_pace 2' 'test_action_history 2' 'test_playtest_feedback 2' 'test_ui_scale 2' 'test_identity_visibility 2' 'test_lan 2' 'test_lan_network 2' 'test_lan_network 3' 'test_lan_network 5' 'test_lan_network 5 --space-case' 'test_lan_network 2 --drop-case'; do
            read -r test players extra <<< "$spec"
            log="$CI_LOG_DIR/lan-${test}-${players}${extra:-}.log"
            status=0
            timeout --kill-after=10s 60s godot --headless --disable-render-loop --path . --script "Test/$test.gd" -- --players="$players" ${extra:-} 2>&1 | tee "$log" || status=$?
            if (( status != 0 )) || ! grep -Eq '^RESULT: [1-9][0-9]* asserts, 0 failures[[:space:]]*$' "$log" || grep -Eq 'SCRIPT ERROR|ERROR:|Parse Error|FAIL ' "$log"; then
              echo "::error::LAN validation failed ($spec, exit $status)."
              exit 1
            fi
          done

      - name: Run all H02 playable network configurations
        run: |
          set -euo pipefail
          for spec in 'free_for_all 2' 'free_for_all 3' 'free_for_all 4' 'free_for_all 5' 'free_for_all 6' 'free_for_all 7' 'free_for_all 8' 'free_for_all 9' 'free_for_all 10' 'classic_identity 5' 'classic_identity 7' 'classic_identity 9' 'ambitious_identity 6' 'ambitious_identity 8' 'ambitious_identity 10'; do
            read -r mode players <<< "$spec"
            log="$CI_LOG_DIR/h02-$mode-$players.log"
            status=0
            timeout --kill-after=10s 60s godot --headless --disable-render-loop --path . --script Test/test_lan_network.gd -- --mode="$mode" --players="$players" 2>&1 | tee "$log" || status=$?
            if (( status != 0 )) || ! grep -Eq '^RESULT: [1-9][0-9]* asserts, 0 failures[[:space:]]*$' "$log" || grep -Eq 'SCRIPT ERROR|ERROR:|Parse Error|FAIL ' "$log"; then
              echo "::error::H02 network failed ($spec, exit $status)."
              exit 1
            fi
          done

      - name: Package playtest source
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/playtest-source.zip" HEAD -- Scripts Scenes Docs project.godot README.md

      - name: Upload playtest source
        uses: actions/upload-artifact@v7
        with:
          name: playtest-source
          path: ${{ runner.temp }}/playtest-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-ci-logs
          path: ${{ runner.temp }}/godot-ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7
